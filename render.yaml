services:
  - type: web
    name: train-routing
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/seed_data.py
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
